<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Visualise Indoor Localisation Accuracy</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicons/android-chrome-192x192.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<meta
			name="description"
			content="This app can be used to visualise the accuracy of the indoor localisation app by comparing it with locations measured with computer-vision method."
		/>

		<script src="https://cdn.jsdelivr.net/npm/three@0.89.0/build/three.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/eventemitter2@0.4.14/lib/eventemitter2.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.js"></script>
		<script>
			if (
				typeof THREE !== 'undefined' &&
				THREE.EventDispatcher &&
				!THREE.EventDispatcher.prototype.apply
			) {
				THREE.EventDispatcher.prototype.apply = function (target) {
					Object.assign(target, THREE.EventDispatcher.prototype);
				};
			}
		</script>
		<script src="https://cdn.jsdelivr.net/npm/@robot-web-tools/ros3djs@0.17.0-SNAPSHOT/build/ros3d.min.js"></script>
		<script>
			console.log(ROS3D.Viewer);
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
